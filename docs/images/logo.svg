<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 72" width="400" height="72" role="img" aria-labelledby="t">
	<title id="t">BlockFusion</title>
	<style>
		.ink { fill: #0f172a; }
		.accent { fill: #0e7490; }
		@media (prefers-color-scheme: dark) {
			.ink { fill: #e6edf3; }
			.accent { fill: #22d3ee; }
		}
	</style>
	<defs>
		<!-- One gradient across every block: the rows and columns fuse into one layout -->
		<linearGradient id="fuse" x1="4" y1="4" x2="68" y2="68" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#22d3ee"/>
			<stop offset="0.55" stop-color="#0e7490"/>
			<stop offset="1" stop-color="#1e3a8a"/>
		</linearGradient>
	</defs>
	<g fill="url(#fuse)">
		<!-- row 1: wide + narrow column -->
		<rect x="4" y="4" width="38" height="18" rx="4"/>
		<rect x="46" y="4" width="22" height="18" rx="4"/>
		<!-- row 2: narrow + wide column -->
		<rect x="4" y="27" width="22" height="18" rx="4"/>
		<rect x="30" y="27" width="38" height="18" rx="4"/>
		<!-- row 3: one full-width block -->
		<rect x="4" y="50" width="64" height="18" rx="4"/>
	</g>
	<text x="86" y="50" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5"><tspan class="ink">Block</tspan><tspan class="accent">Fusion</tspan></text>
</svg>
